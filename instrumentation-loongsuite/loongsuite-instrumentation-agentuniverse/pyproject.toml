[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loongsuite-instrumentation-agentuniverse"
dynamic = ["version"]
description = "LoongSuite agentUniverse Instrumentation"
supports_metrics = true
readme = "README.md"
license = "Apache-2.0"
# agentUniverse's own dependency pins (numpy<2, grpcio==1.63.0, pyarrow<17) have
# no cp313 wheels, so the ``instruments`` extra cannot be installed on 3.13.
# Keep this in step with the tox matrix in tox-loongsuite.ini.
requires-python = ">=3.10,<3.13"
authors = [
  { name = "OpenTelemetry Authors", email = "cncf-opentelemetry-contributors@lists.cncf.io" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "opentelemetry-api >= 1.37.0",
  "opentelemetry-instrumentation >= 0.58b0",
  "opentelemetry-semantic-conventions >= 0.58b0",
  "opentelemetry-util-genai",
]

[project.optional-dependencies]
instruments = [
  "agentUniverse >= 0.0.19",
]

[project.entry-points.opentelemetry_instrumentor]
agentuniverse = "opentelemetry.instrumentation.agentuniverse:AgentUniverseInstrumentor"

[project.urls]
Homepage = "https://github.com/alibaba/loongsuite-python/tree/main/instrumentation-loongsuite/loongsuite-instrumentation-agentuniverse"
Repository = "https://github.com/alibaba/loongsuite-python"

[tool.hatch.version]
path = "src/opentelemetry/instrumentation/agentuniverse/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]
