[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loongsuite-instrumentation-strands"
dynamic = ["version"]
description = "LoongSuite instrumentation for Strands Agents (Python)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api ~= 1.37",
    "opentelemetry-instrumentation >= 0.58b0",
    "opentelemetry-semantic-conventions >= 0.58b0",
    "opentelemetry-util-genai",
    "wrapt >= 1.17.3, < 2.0.0",
]

[project.optional-dependencies]
instruments = [
    "strands-agents >= 0.1.0",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "strands-agents >= 0.1.0",
]

[project.entry-points.opentelemetry_instrumentor]
strands = "opentelemetry.instrumentation.strands:StrandsInstrumentor"

[tool.hatch.version]
path = "src/opentelemetry/instrumentation/strands/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
