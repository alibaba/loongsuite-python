[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loongsuite-instrumentation-strands"
dynamic = ["version"]
description = "LoongSuite instrumentation for Strands Agents (Python)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "LoongSuite Python Agent Authors", email = "caishipeng.csp@alibaba-inc.com" },
  { name = "OpenTelemetry Authors", email = "cncf-opentelemetry-contributors@lists.cncf.io" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "opentelemetry-api ~= 1.37",
    "opentelemetry-instrumentation >= 0.58b0",
    "opentelemetry-semantic-conventions >= 0.58b0",
    "loongsuite-otel-util-genai ~= 0.9.0",
    "wrapt >= 1.17.3, < 2.0.0",
]

[project.optional-dependencies]
instruments = [
    "strands-agents >= 1.50.2, < 2.0.0",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "strands-agents >= 1.50.2, < 2.0.0",
]

[project.entry-points.opentelemetry_instrumentor]
strands = "opentelemetry.instrumentation.strands:StrandsInstrumentor"

[project.urls]
Homepage = "https://github.com/alibaba/loongsuite-python/tree/main/instrumentation-loongsuite/loongsuite-instrumentation-strands"
Repository = "https://github.com/alibaba/loongsuite-python"

[tool.hatch.version]
path = "src/opentelemetry/instrumentation/strands/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
]

[tool.loongsuite.readme]
supported-packages = ["strands-agents >= 1.50.2, < 2.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
